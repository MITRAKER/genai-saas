name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, gateway]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  integration:
    # Boots the real stack (Postgres, Redis, both services) and tests it
    # end to end through the gateway, exactly like a user would.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke_test.sh
      - if: failure()
        run: docker compose logs
