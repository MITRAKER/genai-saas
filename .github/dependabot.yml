# Dependabot opens pull requests that keep dependencies current, and CI checks
# each one like any other change. Updates are grouped (one pull request per
# ecosystem each week) and wait 7 days after a release (cooldown), so a broken
# or malicious release is usually caught by others before it reaches us.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /services/core
      - /services/gateway
      - /services/agent
      - /services/github
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories:
      - /services/core
      - /services/gateway
      - /services/agent
      - /services/github
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Moving to a new Python (3.13, ...) is a decision for a person, with its
      # own pull request. Dependabot keeps the 3.12 patch releases coming.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: deps

  # The images in docker-compose.yml: Postgres with pgvector, and Redis.
  # (The Makefile's test database reads its image from that file.)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # A new major version of a database needs a migration plan, so a person
      # starts it; Dependabot keeps the patch and minor releases coming.
      # (Postgres itself stays on 16: Dependabot keeps the tag's -pg16 ending.)
      - dependency-name: pgvector/pgvector
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
