# Local development stack. Only the gateway publishes a port to your
# machine; core, agent, Postgres and Redis are reachable only inside this network.
services:
  gateway:
    build: ./services/gateway
    ports: ["8000:8000"]
    env_file: .env
    environment:
      CORE_URL: http://core:8001
      AGENT_URL: http://agent:8002
      REDIS_URL: redis://redis:6379/0
    depends_on:
      core: { condition: service_healthy }
      agent: { condition: service_healthy }
      redis: { condition: service_healthy }
    # "docker compose up --wait" waits for this, so tests never race startup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  core:
    build: ./services/core
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 10

  agent:
    build: ./services/agent
    # LLM_PROVIDER and ANTHROPIC_API_KEY come from .env
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      retries: 10

  postgres:
    # pgvector image = Postgres + the vector extension we need in milestone 3.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
